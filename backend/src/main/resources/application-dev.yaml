spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:curio}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:curio}
    password: ${MYSQL_PASSWORD:curio1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-key-must-be-at-least-32-chars}
  refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-key-must-be-at-least-32-chars}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7776000000}  # 90일 — 재방문 마찰↓ (설계결정 #34)

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
  authorization-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

aws:
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET_NAME:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# refresh 토큰 쿠키 (로컬은 http라 Secure off, 같은 사이트라 Lax)
cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}
  domain: ${COOKIE_DOMAIN:}

logging:
  level:
    com.curio: DEBUG
    org.hibernate.SQL: DEBUG
