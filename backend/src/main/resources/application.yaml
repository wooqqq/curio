server:
  # 배포 플랫폼(Railway 등)이 주입하는 PORT 사용, 로컬은 8080
  port: ${PORT:8080}

spring:
  application:
    name: curio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 팝업 배너 이미지 업로드 한도(기본 1MB는 이미지에 작음)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # 아이템 목록 매핑 시 태그(@ManyToMany lazy)를 아이템마다 따로 조회하던 N+1을
        # ID IN (...) 묶음 조회로 줄인다. 페이지네이션과 충돌하는 fetch join 대신 사용.
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 로컬 Redis는 비번 없음(빈 값=인증 안 함), Railway Redis는 비번 필요
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# 헬스체크: 배포 플랫폼(Railway 등)이 새 컨테이너 정상 여부를 확인 → 무중단 롤링 배포
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

api:
  prefix: /api/v1

# 관리자 권한: 쉼표로 구분된 kakao_id 목록(users.kakao_id 값). 비우면 관리자 기능 비활성.
admin:
  kakao-ids: ${ADMIN_KAKAO_IDS:}
