server:
  # 배포 플랫폼(Railway 등)이 주입하는 PORT 사용, 로컬은 8080
  port: ${PORT:8080}

spring:
  application:
    name: curio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 로컬 Redis는 비번 없음(빈 값=인증 안 함), Railway Redis는 비번 필요
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# 헬스체크: 배포 플랫폼(Railway 등)이 새 컨테이너 정상 여부를 확인 → 무중단 롤링 배포
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

api:
  prefix: /api/v1
