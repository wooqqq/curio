name: CI

# develop 푸시 / main·develop 대상 PR에서 빌드+테스트 검증
# (main 머지 = 배포 트리거이므로, 머지 전에 여기서 깨진 코드를 막는다)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest

    # contextLoads 테스트가 실제 DB/Redis 연결을 요구 → 서비스 컨테이너로 띄움
    # (dev 프로필 기본값과 동일하게 맞춤: curio / curio1234 / DB curio)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: curio
          MYSQL_USER: curio
          MYSQL_PASSWORD: curio1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & test
        env:
          SPRING_PROFILES_ACTIVE: dev
          # dev 프로필에 기본값이 없는 값만 더미로 주입 (컨텍스트 로딩용)
          KAKAO_CLIENT_ID: ci-dummy
          KAKAO_CLIENT_SECRET: ci-dummy
        run: ./gradlew build --no-daemon
